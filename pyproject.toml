[project]
name = "yan-port"
version = "0.1.0"
description = "Ownership-safe local routing and Git worktree isolation."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
  "cryptography>=45.0.0",
  "typer>=0.17.0",
]

[project.scripts]
yan-port = "yan_port.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yan_port"]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["A", "B", "C4", "E", "F", "I", "N", "RET", "RUF", "SIM", "UP", "W"]
